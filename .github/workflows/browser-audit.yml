name: Browser, accessibility and Lighthouse audit

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: browser-audit
  cancel-in-progress: false

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser audit tools
        run: npm install --no-save --no-package-lock playwright axe-core lighthouse
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve the checked-out site for deterministic audits
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/indisch-site.log 2>&1 &
          echo $! > /tmp/indisch-site.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/indisch-site.log
          exit 1
      - name: Run responsive browser and WCAG checks
        run: node scripts/e2e_site.cjs
      - name: Benchmark live historical photo retrieval by tab
        run: node scripts/search_effect_benchmark.cjs
      - name: Run mobile Lighthouse audit
        if: always()
        run: |
          mkdir -p artifacts
          npx lighthouse http://127.0.0.1:4173/ \
            --chrome-flags="--headless --no-sandbox" \
            --form-factor=mobile \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=artifacts/lighthouse-mobile.json
          node scripts/check_lighthouse.cjs artifacts/lighthouse-mobile.json
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indisch-beeldarchief-lighthouse-mobile
          path: artifacts/lighthouse-mobile.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload live search effect benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indisch-beeldarchief-search-effect-benchmark
          path: artifacts/search-effect-benchmark.json
          if-no-files-found: ignore
          retention-days: 30

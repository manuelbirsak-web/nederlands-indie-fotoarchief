name: Deploy static site to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_run:
    workflows: ["Refresh Nationaal Archief metadata index"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate HTML structure and archive interface contracts
        run: python3 scripts/validate_site.py
      - name: Compile Python quality tools
        run: python3 -m py_compile scripts/harvest_nationaal_archief.py scripts/harvest_rijksmuseum.py scripts/validate_site.py scripts/test_archive.py scripts/test_rijksmuseum.py
      - name: Test archival metadata classification
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", text, re.S | re.I)
          if not scripts:
              raise SystemExit("No inline JavaScript found")
          Path("/tmp/site.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/site.js
  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed page and original family photo bytes
        run: |
          python3 - <<'PY'
          import hashlib
          import urllib.request

          base = "https://manuelbirsak-web.github.io/nederlands-indie-fotoarchief"
          with urllib.request.urlopen(base + "/", timeout=30) as response:
              html = response.read().decode("utf-8")
              assert response.status == 200
          assert "MAUDY-ELLEN" in html
          assert "HAUS-ELLEN" not in html
          assert "assets/family/IMG_5108.jpeg" in html
          assert "assets/family/IMG_5107.jpeg" in html
          assert "assets/family/birsak-woning.jpg" not in html
          assert "assets/family/birsak-familieportret.jpg" not in html

          expected = {
              "assets/family/IMG_5108.jpeg": (166524, "2807b2f5048ca65df0026d02c8449f411fb9415c7f9871403fc1d0024a4893fb"),
              "assets/family/IMG_5107.jpeg": (259653, "9766e8a2e8a0976a8c00ee522474aa352322909d5acd4ab0186d969a1bff3ccb"),
          }
          for path, (size, digest) in expected.items():
              with urllib.request.urlopen(base + "/" + path, timeout=30) as response:
                  data = response.read()
                  assert response.status == 200
              assert len(data) == size, (path, len(data), size)
              assert hashlib.sha256(data).hexdigest() == digest, path
              assert data.startswith(b"\\xff\\xd8\\xff"), path
              print(f"PASS {path}: {len(data)} bytes, SHA-256 {digest}")
          print("PASS deployed page and both original family photos verified byte-for-byte")
          PY

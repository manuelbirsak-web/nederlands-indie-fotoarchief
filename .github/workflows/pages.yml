name: Deploy static site to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_run:
    workflows: ["Refresh Nationaal Archief metadata index"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:
  pull_request:
    branches: ["main"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  validate:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate HTML structure and archive interface contracts
        run: python3 scripts/validate_site.py
      - name: Compile Python quality tools
        run: python3 -m py_compile scripts/harvest_nationaal_archief.py scripts/harvest_rijksmuseum.py scripts/build_knil_weapons_index.py scripts/validate_site.py scripts/test_archive.py scripts/test_rijksmuseum.py scripts/test_knil_weapons.py
      - name: Test archival metadata classification
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", text, re.S | re.I)
          if not scripts:
              raise SystemExit("No inline JavaScript found")
          Path("/tmp/site.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/site.js
  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed page and original family photo bytes
        run: |
          python3 - <<'PY'
          import hashlib
          import urllib.request

          base = "https://manuelbirsak-web.github.io/nederlands-indie-fotoarchief"
          with urllib.request.urlopen(base + "/", timeout=30) as response:
              html = response.read().decode("utf-8")
              assert response.status == 200
          assert "MAUDY-ELLEN" in html
          assert "HAUS-ELLEN" not in html
          assert "assets/family/IMG_5108.jpeg" in html
          assert "assets/family/IMG_5107.jpeg" in html
          assert "assets/family/birsak-woning.jpg" not in html
          assert "assets/family/birsak-familieportret.jpg" not in html

          assert 'id="knilWeapons"' in html
          assert "loadKnilWeaponsIndex();" in html
          with urllib.request.urlopen(base + "/assets/knil-bewapening.json", timeout=30) as response:
              weapons = __import__("json").load(response)
              assert response.status == 200
          weapon_records = weapons["records"]
          assert weapons["selection"]["recordCount"] == 136
          assert weapons["selection"]["uniqueDescriptions"] == 107
          assert len(weapon_records) == 136
          assert all(record["rights"] == "http://rightsstatements.org/page/CNE/1.0/" for record in weapon_records)
          assert all(record["primaryRightsStatus"] == "Publiek Domein" for record in weapon_records)
          assert all(record["reuseAllowed"] is True and record["downloadAvailable"] is True for record in weapon_records)
          assert all(record["primaryRightsCheckedAt"] == "2026-11-13" for record in weapon_records)
          assert all(record["rightsEvidenceUrl"].startswith("https://www.nationaalarchief.nl/onderzoeken/fotocollectie/") for record in weapon_records)
          assert weapons["primaryRightsAudit"]["checkedRecords"] == 136
          assert weapons["primaryRightsAudit"]["downloadAvailableRecords"] == 136
          assert all(record["imagePublished"] is False for record in weapon_records)
          assert all(not record.get("imageUrl") and not record.get("thumbnail") for record in weapon_records)
          print("PASS deployed KNIL index: 136 source records, 107 descriptions, 136 primary rights checks; image metadata-only")
          with urllib.request.urlopen(base + "/favicon.svg", timeout=30) as response:
              favicon = response.read()
              assert response.status == 200 and b"<svg" in favicon
          print("PASS deployed SVG favicon")

          expected = {
              "assets/family/IMG_5108.jpeg": (166524, "2807b2f5048ca65df0026d02c8449f411fb9415c7f9871403fc1d0024a4893fb"),
              "assets/family/IMG_5107.jpeg": (259653, "9766e8a2e8a0976a8c00ee522474aa352322909d5acd4ab0186d969a1bff3ccb"),
          }
          for path, (size, digest) in expected.items():
              with urllib.request.urlopen(base + "/" + path, timeout=30) as response:
                  data = response.read()
                  assert response.status == 200
              assert len(data) == size, (path, len(data), size)
              assert hashlib.sha256(data).hexdigest() == digest, path
              assert data.startswith(bytes.fromhex("ffd8ff")), path
              print(f"PASS {path}: {len(data)} bytes, SHA-256 {digest}")
          print("PASS deployed page and both original family photos verified byte-for-byte")
          PY

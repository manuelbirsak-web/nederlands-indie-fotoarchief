name: Refresh Nationaal Archief metadata index
on:
  push:
    branches: ["main"]
    paths:
      - "scripts/harvest_nationaal_archief.py"
      - "scripts/harvest_rijksmuseum.py"
      - ".github/workflows/refresh-archive-index.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nationaal-archief-index
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Refresh rights-aware Nationaal Archief metadata index
        run: python3 scripts/harvest_nationaal_archief.py
      - name: Refresh rights-aware Rijksmuseum photo index
        run: python3 scripts/harvest_rijksmuseum.py
      - name: Commit changed institutional indexes
        run: |
          if git diff --quiet -- assets/nationaal-archief.json assets/rijksmuseum.json; then
            echo "No metadata changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/nationaal-archief.json assets/rijksmuseum.json
          git commit -m "Refresh institutional photo metadata indexes"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
